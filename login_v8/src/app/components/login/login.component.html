<!-- start login component -->
<!-- start login form -->
<div class="landing-page p-5" id="landing-page">
    <!-- form layout -->
    <section class="form-layout text-center">
        <div class="container w-50">
            <div class="row">
                <!-- title -->
                <div class="title rounded-top-5 py-5">
                    <h3 class="h1 text-white">Sign In</h3>
                </div>

                <!-- form -->
                <div class="form mt-5">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control rounded-5" id="floatingInput" placeholder="Username">
                        <label for="floatingInput" class="fw-bold">Username</label>
                      </div>
                      <div class="form-floating">
                        <input type="password" class="form-control rounded-5" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword" class="fw-bold">Password</label>
                      </div>
                </div>

                <!-- forgot link -->
                <div class="forgot mt-3">
                    <h5><span class="pe-1">Forgot</span><a href="#">Username/Password?</a></h5>
                </div>

                <!-- sign in button -->
                <div class="sign-btn my-5">
                    <button class="btn form-control rounded-5 fw-bold py-2">SIGN IN</button>
                </div>

                <!-- sign up button -->
                <div class="sign-up mt-5">
                    <h6 class="text-success">Don't Have an account?</h6>
                    <button class="btn fw-bold">SIGN UP NOW</button>
                </div>
            </div>
        </div>
    </section>
</div>
<!-- end login form -->
<!-- end login component -->
